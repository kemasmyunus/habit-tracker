<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habit Tracker</title>
<style>
:root{--bg:#0b0e11;--pn:#161a1f;--pn2:#1e2329;--bd:#2b3139;--tx:#eaecef;--mu:#848e9c;--up:#0ecb81;--dn:#f6465d;--ac:#f0b90b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.num,.time,.tk b{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header{background:var(--pn);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.bar{max-width:980px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:20px;height:48px}
.logo{font-weight:800;color:var(--ac);letter-spacing:.5px}
nav{display:flex;height:100%}nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);padding:0 14px;cursor:pointer;font:inherit;font-weight:600}
nav button.on{color:var(--tx);border-color:var(--ac)}
.clock{margin-left:auto;color:var(--mu);font-size:13px}
.ticker{background:var(--bg);border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap}
.ticker .in{padding:10px 14px;display:flex;gap:28px}
.tk{display:flex;gap:8px;align-items:center;font-size:13px}.tk b{font-size:13px}
.up{color:var(--up)}.dn{color:var(--dn)}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:6px;margin-bottom:12px}
.ph{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);gap:8px;flex-wrap:wrap}
.ph h2{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.pb{padding:12px 14px}.mu{color:var(--mu);font-size:12px}
.badge{font-size:11px;padding:1px 8px;border-radius:3px;font-weight:700}
.b-dn{background:#f6465d26;color:var(--dn)}.b-up{background:#0ecb8126;color:var(--up)}.b-ac{background:#f0b90b26;color:var(--ac)}.b-mu{background:var(--pn2);color:var(--mu)}
select,input{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--bd);border-radius:4px;padding:6px 10px}
select:focus,input:focus{outline:1px solid var(--ac)}
svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;padding:0 14px 12px}
.lg{display:flex;align-items:center;gap:7px;font-size:13px}.sw{width:12px;height:12px;border-radius:2px;flex:none}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}.row:hover{background:var(--pn2)}
.grow{flex:1;min-width:0}.time{min-width:112px;font-size:13px}
.bar4{width:3px;align-self:stretch;border-radius:2px;flex:none}
.btn{border:1px solid var(--bd);background:var(--pn2);color:var(--tx);padding:6px 12px;border-radius:4px;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--mu)}.btn.ok{background:var(--up);color:#07120d;border-color:var(--up)}
.btn.pri{background:var(--ac);color:#1a1400;border-color:var(--ac)}.btn.sk{color:var(--mu)}
.acts{display:flex;gap:6px;flex:none}
.empty{color:var(--mu);padding:16px 14px;text-align:center;font-size:13px}
.item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--bd);cursor:pointer}
.item:first-child{border-top:0}.item:hover{background:var(--pn2)}.item.sel{background:var(--pn2);box-shadow:inset 3px 0 var(--ac)}
.form{display:grid;gap:10px;padding:14px;border-top:1px solid var(--bd)}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.fr input[type=text]{flex:1;min-width:140px}
.x{background:none;border:0;color:var(--dn);cursor:pointer;font-size:16px;padding:4px 8px}
input[type=color]{padding:2px;width:40px;height:32px}
input[type=time],input[type=number]{color-scheme:dark}
.hide{display:none}
@media(max-width:560px){.row{flex-wrap:wrap}.time{min-width:auto}.acts{width:100%;justify-content:flex-end}}
</style></head><body>
<header><div class="bar"><span class="logo">◆ HABITX</span>
<nav><button id="n1" class="on">Dashboard</button><button id="n2">Kelola Habit</button></nav>
<span class="clock num" id="clock"></span></div></header>
<div class="wrap">
<section id="p1">
 <div class="panel">
  <div class="ph"><h2>Progres Habit <span class="badge b-mu">GABUNGAN</span></h2>
   <select id="rng"><option value="7">7H</option><option value="14">14H</option><option value="30">30H</option></select></div>
  <div class="ticker"><div class="in" id="ticker"></div></div>
  <div class="pb" style="padding-bottom:4px" id="chart"></div>
  <div class="legend" id="legend"></div>
 </div>
 <div class="panel"><div class="ph"><h2>Terlewat <span class="badge b-dn" id="c1">0</span></h2></div><div id="s1"></div></div>
 <div class="panel"><div class="ph"><h2>Sekarang <span class="badge b-ac" id="c2">0</span></h2></div><div id="s2"></div></div>
 <div class="panel"><div class="ph"><h2>Jadwal Terdekat <span class="badge b-mu" id="c3">0</span></h2><span class="mu">hanya tampilan</span></div><div id="s3"></div></div>
 <div class="panel"><div class="ph"><h2>Riwayat Hari Ini <span class="badge b-up" id="c4">0</span></h2></div><div id="s4"></div></div>
</section>

<section id="p2" class="hide">
 <div class="panel"><div class="ph"><h2>Daftar Habit</h2><span class="mu">Klik untuk mengatur sub habit</span></div>
  <div id="list"></div>
  <div class="form"><div class="fr"><input type="text" id="hn" placeholder="Nama habit baru, mis. Olahraga"><input type="color" id="hc" value="#2962ff"><button class="btn pri" id="ha">Tambah</button></div></div>
 </div>
 <div class="panel hide" id="det"></div>
</section>
</div>
<script>
const $=s=>document.querySelector(s);
const COL=["#2962ff","#0ecb81","#f0b90b","#b66dff","#f6465d","#22d3ee","#ff8a3d","#ff5fa2"];
let S={habits:[],logs:{}},sel=null;
function load(){try{const r=localStorage.getItem("habit-tracker-v1");if(r)S=JSON.parse(r)}catch(e){}
 let seeded=false;try{seeded=localStorage.getItem("habit-seeded")}catch(e){}
 if(!S.habits.length&&!seeded){
  S.habits=[{id:"h1",name:"Olahraga",color:"#2962ff",subs:[{id:"s1",name:"Lari pagi",start:"06:00",end:"06:30"},{id:"s2",name:"Push-up",start:"18:00",end:"18:15"}]},
  {id:"h2",name:"Sholat",color:"#0ecb81",subs:[{id:"s3",name:"Subuh",start:"04:30",end:"05:00"},{id:"s4",name:"Zuhur",start:"12:00",end:"12:30"},{id:"s5",name:"Ashar",start:"15:15",end:"15:45"}]}];
  try{localStorage.setItem("habit-seeded","1")}catch(e){}}}
function save(){try{localStorage.setItem("habit-tracker-v1",JSON.stringify(S))}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,9);
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const m=t=>{const[a,b]=t.split(":");return +a*60+ +b};
const hm=n=>{n=((n%1440)+1440)%1440;return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st=(k,id)=>{const v=S.logs[k]&&S.logs[k][id];return v===true?"done":v||null};
const done=(k,id)=>st(k,id)==="done";
function setSt(k,id,v){S.logs[k]=S.logs[k]||{};if(v)S.logs[k][id]=v;else delete S.logs[k][id];save();render()}
function pct(h,k){return h.subs.length?h.subs.filter(s=>done(k,s.id)).length/h.subs.length:0}
const dayOff=n=>{const d=new Date();d.setDate(d.getDate()-n);return d};

function ticker(){
 const k0=key(dayOff(0)),k1=key(dayOff(1));
 $("#ticker").innerHTML=S.habits.length?S.habits.map(h=>{const a=pct(h,k0)*100,d=a-pct(h,k1)*100,c=d>0?"up":d<0?"dn":"mu";
  return `<div class="tk"><span class="sw" style="background:${h.color}"></span><b>${esc(h.name)}</b><span class="${c} num">${d>0?"▲":d<0?"▼":"•"} ${Math.abs(d).toFixed(0)}%</span><span class="mu">hari ini ${a.toFixed(0)}%</span></div>`}).join(""):`<span class="mu">Belum ada habit</span>`;
}
function chart(){
 const n=+$("#rng").value,W=800,H=300,L=46,R=16,T=14,B=32,days=[];
 for(let i=n-1;i>=0;i--)days.push(dayOff(i));
 const X=i=>L+(n>1?i*(W-L-R)/(n-1):0),Y=v=>T+(1-v)*(H-T-B);
 let g="";
 for(let i=0;i<=4;i++){const v=i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2b3139" stroke-dasharray="3 4"/><text x="${L-8}" y="${Y(v)+3}" text-anchor="end" font-size="10" fill="#848e9c" font-family="monospace">${v*100}%</text>`}
 const step=Math.ceil(n/8);
 days.forEach((d,i)=>{if(i%step===0||i===n-1)g+=`<text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#848e9c" font-family="monospace">${d.getDate()}/${d.getMonth()+1}</text>`});
 S.habits.forEach(h=>{
  const p=days.map((d,i)=>[X(i),Y(pct(h,key(d)))]);
  g+=`<polyline fill="none" stroke="${h.color}" stroke-width="2.2" stroke-linejoin="round" points="${p.map(a=>a.join(",")).join(" ")}"/>`;
  p.forEach((a,i)=>{const k=key(days[i]);g+=`<circle cx="${a[0]}" cy="${a[1]}" r="3.5" fill="#161a1f" stroke="${h.color}" stroke-width="2"><title>${esc(h.name)} • ${k} • ${h.subs.filter(s=>done(k,s.id)).length}/${h.subs.length}</title></circle>`});
 });
 $("#chart").innerHTML=S.habits.length?`<svg viewBox="0 0 ${W} ${H}">${g}</svg>`:`<div class="empty">Belum ada habit. Tambahkan di Kelola Habit.</div>`;
 $("#legend").innerHTML=S.habits.map(h=>`<div class="lg"><span class="sw" style="background:${h.color}"></span>${esc(h.name)}</div>`).join("");
}

function sched(){
 const now=new Date(),k=key(now),nm=now.getHours()*60+now.getMinutes();
 $("#clock").textContent=now.toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short"})+" "+hm(nm);
 const all=[];S.habits.forEach(h=>h.subs.forEach(s=>{const a=m(s.start);let b=m(s.end);if(b<a)b+=1440;all.push({h,s,a,b,v:st(k,s.id)})}));
 all.sort((x,y)=>x.a-y.a);
 const open=all.filter(x=>!x.v);
 const late=open.filter(x=>x.b<nm),cur=open.filter(x=>x.a<=nm&&x.b>=nm),nxt=open.filter(x=>x.a>nm),hist=all.filter(x=>x.v);
 const row=(x,acts,extra)=>`<div class="row"><span class="bar4" style="background:${x.h.color}"></span><div class="time">${x.s.start}–${x.s.end}</div><div class="grow"><b>${esc(x.s.name)}</b> <span class="mu">${esc(x.h.name)}${extra||""}</span></div>${acts||""}</div>`;
 const btn=x=>`<div class="acts"><button class="btn ok" onclick="setSt('${k}','${x.s.id}','done')">✓ Selesai</button><button class="btn sk" onclick="setSt('${k}','${x.s.id}','skip')">Skip</button></div>`;
 const put=(id,c,list,fn,msg)=>{$("#s"+id).innerHTML=list.length?list.map(fn).join(""):`<div class="empty">${msg}</div>`;$("#c"+c).textContent=list.length};
 put(1,1,late,x=>row(x,btn(x)," • berakhir "+hm(x.b)),"Tidak ada yang terlewat 👍");
 put(2,2,cur,x=>row(x,btn(x)," • sisa "+(x.b-nm)+" menit"),"Tidak ada sesi yang berjalan sekarang");
 put(3,3,nxt.slice(0,6),x=>row(x,`<span class="mu num">dalam ${x.a-nm>=60?Math.floor((x.a-nm)/60)+"j ":""}${(x.a-nm)%60}m</span>`),"Tidak ada jadwal berikutnya hari ini");
 put(4,4,hist,x=>row(x,`<span class="badge ${x.v==="done"?"b-up":"b-mu"}">${x.v==="done"?"SELESAI":"SKIP"}</span><button class="btn sk" onclick="setSt('${k}','${x.s.id}',null)">Batalkan</button>`),"Belum ada aktivitas hari ini");
}

function list(){
 $("#list").innerHTML=S.habits.length?S.habits.map(h=>`<div class="item ${h.id===sel?"sel":""}" onclick="pick('${h.id}')"><span class="sw" style="background:${h.color}"></span><div class="grow"><b>${esc(h.name)}</b></div><span class="mu">${h.subs.length} sub ›</span></div>`).join(""):`<div class="empty">Belum ada habit.</div>`;
 const h=S.habits.find(x=>x.id===sel),d=$("#det");
 if(!h){d.classList.add("hide");return}
 d.classList.remove("hide");
 d.innerHTML=`<div class="ph"><h2><span class="sw" style="background:${h.color}"></span>${esc(h.name)}</h2><div class="fr"><input type="color" value="${h.color}" onchange="setCol('${h.id}',this.value)"><button class="btn" onclick="ren('${h.id}')">Ubah nama</button><button class="x" title="Hapus habit" onclick="delH('${h.id}')">🗑</button></div></div>
 <div class="mu" style="padding:10px 14px">Grafik habit ini dibagi ${h.subs.length||1} tingkat</div>
 ${h.subs.length?h.subs.map(s=>`<div class="row"><div class="time">${s.start}–${s.end}</div><div class="grow">${esc(s.name)}</div><button class="x" onclick="delS('${h.id}','${s.id}')">✕</button></div>`).join(""):`<div class="empty">Belum ada sub habit.</div>`}
 <div class="form"><b>Tambah sub habit</b>
  <input type="text" id="sn" placeholder="Nama, mis. Subuh">
  <div class="fr"><label class="mu">Mulai <input type="time" id="ss" value="06:00"></label>
   <select id="sm" onchange="mode()"><option value="end">Jam selesai</option><option value="dur">Durasi (menit)</option></select>
   <input type="time" id="se" value="06:30"><input type="number" id="sd" min="1" value="30" class="hide" style="width:90px"></div>
  <button class="btn pri" onclick="addS('${h.id}')">Tambah sub habit</button></div>`;
}
function mode(){const d=$("#sm").value==="dur";$("#se").classList.toggle("hide",d);$("#sd").classList.toggle("hide",!d)}
function pick(id){sel=sel===id?null:id;list()}
function addS(id){const h=S.habits.find(x=>x.id===id),n=$("#sn").value.trim(),s=$("#ss").value;
 if(!n||!s){alert("Isi nama dan jam mulai");return}
 let e;if($("#sm").value==="dur"){const d=+$("#sd").value;if(!d||d<1){alert("Durasi tidak valid");return}e=hm(m(s)+d)}else{e=$("#se").value;if(!e){alert("Isi jam selesai");return}}
 h.subs.push({id:uid(),name:n,start:s,end:e});save();render()}
function delS(h,s){const x=S.habits.find(a=>a.id===h);x.subs=x.subs.filter(a=>a.id!==s);save();render()}
function delH(id){if(confirm("Hapus habit ini beserta sub habitnya?")){S.habits=S.habits.filter(a=>a.id!==id);sel=null;save();render()}}
function ren(id){const h=S.habits.find(a=>a.id===id),n=prompt("Nama baru:",h.name);if(n&&n.trim()){h.name=n.trim();save();render()}}
function setCol(id,c){S.habits.find(a=>a.id===id).color=c;save();render()}
$("#ha").onclick=()=>{const n=$("#hn").value.trim();if(!n)return;
 const id=uid();S.habits.push({id,name:n,color:$("#hc").value,subs:[]});sel=id;$("#hn").value="";$("#hc").value=COL[S.habits.length%COL.length];save();render()};
$("#hn").onkeydown=e=>{if(e.key==="Enter")$("#ha").click()};
$("#rng").onchange=chart;
function tab(n){$("#p1").classList.toggle("hide",n!==1);$("#p2").classList.toggle("hide",n!==2);$("#n1").classList.toggle("on",n===1);$("#n2").classList.toggle("on",n===2);render()}
$("#n1").onclick=()=>tab(1);$("#n2").onclick=()=>tab(2);
function render(){ticker();chart();sched();list()}
load();render();setInterval(sched,30000);
</script></body></html>
